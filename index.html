<!doctype html>
<html lang="en">
  <head>
    <!-- Metadata -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8-Bit To-Do List</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/src/css/style.css" />

    <!-- Scripts -->
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- ========================================
         HEADER: Title & Theme Toggle
         ======================================== -->
    <header>
      <h1>8-BIT TO-DO</h1>
      <button
        id="themeToggle"
        title="Toggle dark/light theme"
        aria-label="Toggle dark/light theme"
      >
        🌙 DARK
      </button>
    </header>

    <!-- ========================================
         MAIN CONTENT
         ======================================== -->
    <main>
      <!-- New Task Input Section -->
      <section class="newTask">
        <form>
          <input
            type="text"
            maxlength="40"
            autocomplete="off"
            placeholder="ADD ITEM..."
            aria-label="Enter new task"
          />
          <button
            type="submit"
            title="Add new item"
            aria-label="Add new item to list"
          >
            +
          </button>
        </form>
      </section>

      <!-- Tasks List Section -->
      <section class="tasksList">
        <header>
          <h2>TASKS</h2>
          <button
            id="clear"
            title="Clear the list"
            aria-label="Remove all items from the list"
          >
            CLEAR
          </button>
        </header>

        <!-- Tasks Unordered List -->
        <ul id="tasks" class="tasks">
          <!-- Tasks will be rendered here by TypeScript -->
        </ul>
      </section>
    </main>
  </body>
</html>
