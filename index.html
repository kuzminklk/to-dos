    <title>To-do list</title>
    <link rel="stylesheet" href="/src/css/style.css" />

  </head>

  <body>
    <main>
      <section class="newTask">
        <form>
          <input
            type="text"
            maxlength="40"
            autocomplete="off"
            placeholder="Add item"
          />
          <button title="Add new item" aria-label="Add new item to list">
            +
          </button>
        </form>
      </section>

      <section class="tasksList">
        <header>
          <h2>To-do's</h2>
          <button
            id="clear"
            title="Clear the list"
            aria-label="Remove all items from the list"
          >
            Clear
          </button>
        </header>
        <hr />
